name: test-filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install telethon
      - run: |
          python -c "from listener import classify; print('yellow->', classify('УВАГА! ПОВІТРЯНА ТРИВОГА! У місті Березівка та Березівському районі оголошено повітряну тривогу. Загроза 400. Негайно пройдіть в укриття. Жовтий рівень · Дронова загроза')); print('red->', classify('УВАГА! ПОВІТРЯНА ТРИВОГА! У місті Березівка та Березівському районі оголошено повітряну тривогу. Загроза 400. Негайно пройдіть в укриття. Червоний рівень - Ракетна загроза')); print('green->', classify('УВАГА! ВІДБІЙ ПОВІТРЯНОЇ ТРИВОГИ! У місті Березівка та Березівському районі оголошено відбій повітряної тривоги')); print('silence->', classify('Хвилина мовчання. Щодня о 09:00 Україна завмирає на хвилину, щоб вшанувати пам’ять усіх, хто віддав своє життя за нашу свободу та незалежність'))"
